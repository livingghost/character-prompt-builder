[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "character-prompt-builder"
version = "2026.10.31.2"
description = "Art-direction-first prompt construction, visual-state, and reference-evidence tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
  "resvg-py==0.5.0",
  "numpy==2.5.2",
  "Pillow==13.0.0",
  "rasterio==1.5.1",
  "opencv-python-headless==5.0.0.93",
  "scikit-image==0.26.0",
]

[project.urls]
Documentation = "https://github.com/livingghost/character-prompt-builder"

[tool.setuptools]
packages = []

[tool.uv]
package = false
