[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "character-prompt-builder"
version = "2026.9.23.4"
description = "Art-direction-first prompt construction, visual-state, and reference-evidence tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = []
dynamic = ["optional-dependencies"]

[project.urls]
Documentation = "https://github.com/livingghost/character-prompt-builder"

[tool.setuptools]
packages = []

[tool.setuptools.dynamic.optional-dependencies]
visual = { file = ["requirements-visual.txt"] }
