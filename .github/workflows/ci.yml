name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Keep validate.py's "no development artifact" guarantee satisfied: the check
  # steps below must not leave scripts/__pycache__ behind.
  PYTHONDONTWRITEBYTECODE: "1"
  # A native crash prints the Python stack of every thread instead of ending the
  # process silently.
  PYTHONFAULTHANDLER: "1"

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The Character Sheet gate renders CJK design text through resolved
      # font files. The Windows image ships Meiryo, Malgun Gothic and
      # Microsoft YaHei; the Linux image ships no CJK font and the raster
      # layer fails closed without one. Where the resolver's known paths are
      # absent, it asks fontconfig, as this step does.
      - name: Install the CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list --format '%{file}\n' ':lang=ja:weight=regular' | grep .
          fc-list --format '%{file}\n' ':lang=ja:weight=bold' | grep .

      # Temporal evidence reads audio and video through ffprobe, which neither
      # runner image ships.
      - name: Install FFmpeg
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg --no-progress -y
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Every step after the install runs even when an earlier one failed, and
      # the runner runs every suite whatever another suite did, so one run names
      # every failure. The job still fails when any check failed.
      - name: Install tested release dependencies
        id: install
        run: uv pip install --system -r requirements-tested.txt

      - name: Validate exact tested dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/check_dependencies.py --tested

      - name: Rebuild generated metadata
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/rebuild_metadata.py

      - name: Rebuild canonical pilot
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python examples/state-aware-pilot/build_example.py

      # An untracked file is a generated artifact too, so the working tree must
      # be exactly the checkout, not only free of modifications.
      - name: Verify generated artifacts are committed and reproducible
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          git status --porcelain --untracked-files=all
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      # Each suite, check command and unittest module runs once, with CPB_HOME at
      # one scratch configuration directory whose pack state enables the shipped packs alone.
      - name: Run every test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/run_checks.py --jobs 4

      - name: Validate repository structure and contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/validate.py .

  package:
    name: Package (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The Character Sheet gate renders CJK design text through resolved
      # font files. The Windows image ships Meiryo, Malgun Gothic and
      # Microsoft YaHei; the Linux image ships no CJK font and the raster
      # layer fails closed without one. Where the resolver's known paths are
      # absent, it asks fontconfig, as this step does.
      - name: Install the CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list --format '%{file}\n' ':lang=ja:weight=regular' | grep .
          fc-list --format '%{file}\n' ':lang=ja:weight=bold' | grep .

      # Temporal evidence reads audio and video through ffprobe, which neither
      # runner image ships.
      - name: Install FFmpeg
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg --no-progress -y
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install tested release dependencies
        run: uv pip install --system -r requirements-tested.txt

      - name: Validate exact tested dependencies
        run: python scripts/check_dependencies.py --tested

      - name: Build and validate release archive
        run: |
          python scripts/package.py --reports-dir "$RUNNER_TEMP/reports"
          OUT=$(python -c 'import sys; sys.path.insert(0, "scripts"); from package_metadata import RELEASE_OUTPUT; print(RELEASE_OUTPUT)')
          cat "$OUT.sha256"
          cp "$RUNNER_TEMP/reports/archive-check.json" dist/archive-check.json
          python -c 'import json; print("content_sha256", json.load(open("dist/archive-check.json"))["content_sha256"])'

      - name: Keep the gate reports of a failed build
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload platform archive for reproducibility comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/archive-check.json
          if-no-files-found: error
          retention-days: 2

  package-consistency:
    name: Compare release archives across operating systems
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ubuntu-latest
          path: package-linux

      - name: Download Windows archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-windows-latest
          path: package-windows

      - name: Require matching archive content
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def load(root):
              base = Path(root)
              archive = next(base.glob("*.zip"))
              check = json.loads((base / "archive-check.json").read_text(encoding="utf-8"))
              return archive.read_bytes(), check["content_sha256"]

          linux_bytes, linux_content = load("package-linux")
          windows_bytes, windows_content = load("package-windows")

          failures = []
          # Member names plus decompressed bytes. This is the portable identity:
          # it survives a differing deflate implementation.
          if linux_content != windows_content:
              failures.append(
                  f"content digests differ: linux={linux_content} windows={windows_content}"
              )
          # Raw bytes additionally cover member metadata such as permission bits
          # and create_system. Both runners pin the same Python, so this must
          # hold too; if only this check fails, suspect the zlib build rather
          # than the archive contents.
          if linux_bytes != windows_bytes:
              failures.append(
                  "raw archive bytes differ: "
                  f"linux={hashlib.sha256(linux_bytes).hexdigest()} "
                  f"windows={hashlib.sha256(windows_bytes).hexdigest()}"
              )
          if failures:
              raise SystemExit("; ".join(failures))
          print("content_sha256", linux_content)
          print("archive_sha256", hashlib.sha256(linux_bytes).hexdigest())
          PY
